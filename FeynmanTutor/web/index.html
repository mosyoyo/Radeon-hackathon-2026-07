<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeynmanTutor — 你的 AMD Radeon 学习 Agent</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2e;
    --panel2: #1f2440;
    --border: #2a3050;
    --text: #e8eaf6;
    --muted: #9aa0c0;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --good: #00b894;
    --warn: #fdcb6e;
    --bad: #e17055;
    --tool: #3a3f6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: white;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); color: var(--good);
    border: 1px solid rgba(0,184,148,.4);
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  button:hover { border-color: var(--accent2); color: var(--accent2); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #7d6cf0; color: white; }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.55;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); padding: 0 4px; }

  .tool-strip {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 2px;
  }
  .tool-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--tool); border: 1px solid var(--border); color: var(--accent2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .tool-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
  .tool-chip.done .dot { background: var(--good); animation: none; }

  #suggestions {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 10px;
  }
  .sug {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px dashed var(--border); color: var(--muted);
    cursor: pointer;
  }
  .sug:hover { color: var(--accent2); border-color: var(--accent2); }

  #inputbar {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1; resize: none; height: 46px; max-height: 140px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; outline: none;
    font-family: inherit; line-height: 1.4;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  #send { width: 72px; }

  .typing .bubble { color: var(--muted); }
  .typing .bubble::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% {opacity: 0;} }

  footer {
    font-size: 11px; color: var(--muted); text-align: center;
    padding: 8px; border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .err .bubble { border-color: var(--bad); color: #ffb3a0; }
</style>
</head>
<body>
<header>
  <div class="logo">F</div>
  <div>
    <h1>FeynmanTutor</h1>
    <div class="sub">本地学习 Agent · AMD Radeon GPU · ROCm · Qwen2.5-14B</div>
  </div>
  <div class="right">
    <span class="badge" id="status">…连接中</span>
    <button id="reset" title="开启全新学习会话">↻ 新会话</button>
  </div>
</header>

<div id="chat"></div>

<div id="suggestions">
  <div class="sug">我想学 Raft 共识算法</div>
  <div class="sug">我想学 Python</div>
  <div class="sug">我想学 Transformer 架构</div>
  <div class="sug">怎么开始?</div>
</div>

<div id="inputbar">
  <textarea id="input" placeholder="告诉我想学什么，或回答我的提问…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send" class="primary">发送</button>
</div>

<footer>推理运行在本地 AMD Radeon GPU 上 · 无外部 API · 源码见 GitHub</footer>

<script>
const chatEl = document.getElementById('chat');
const statusEl = document.getElementById('status');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

let sessionId = null;

async function init() {
  try {
    const r = await fetch('/api/session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic: ''}),
    });
    const d = await r.json();
    sessionId = d.session_id;
    statusEl.textContent = '● 已连接 (AMD Radeon)';
    statusEl.style.color = '#00b894';
  } catch (e) {
    statusEl.textContent = '✕ 连接失败';
    statusEl.style.color = '#e17055';
  }
}

function addMsg(role, text, extraClass) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (extraClass ? ' ' + extraClass : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'user' ? '你' : 'FeynmanTutor';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(meta);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

function addToolChips(names) {
  const strip = document.createElement('div');
  strip.className = 'tool-strip';
  const chips = [];
  for (const n of names) {
    const c = document.createElement('span');
    c.className = 'tool-chip';
    c.innerHTML = '<span class="dot"></span>' + n;
    strip.appendChild(c);
    chips.push(c);
  }
  chatEl.appendChild(strip);
  chatEl.scrollTop = chatEl.scrollHeight;
  return chips;
}

let isBusy = false;

async function send(message) {
  if (isBusy || !message.trim()) return;
  isBusy = true;
  sendEl.disabled = true;
  addMsg('user', message);
  inputEl.value = '';

  // thinking bubble
  const thinking = addMsg('agent', '思考中', 'typing');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message}),
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      thinking.remove();
      addMsg('agent', '出错了: ' + (e.detail || resp.status), 'err');
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let lastBubble = thinking;
    let pendingChips = null;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';

      for (const part of parts) {
        const lines = part.split('\n');
        const evLine = lines.find(l => l.startsWith('event:'));
        const dataLine = lines.find(l => l.startsWith('data:'));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(6).trim();
        let data = {};
        try { data = JSON.parse(dataLine.slice(5)); } catch {}
        handleEvent(ev, data, lastBubble);
      }
    }
  } catch (e) {
    thinking.remove();
    addMsg('agent', '网络错误: ' + e.message, 'err');
  } finally {
    isBusy = false;
    sendEl.disabled = false;
    thinking.querySelector('.bubble').textContent = '';
    thinking.classList.remove('typing');
    inputEl.focus();
  }
}

function handleEvent(ev, data, lastBubble) {
  if (ev === 'assistant') {
    if (lastBubble.classList.contains('typing')) {
      lastBubble.classList.remove('typing');
      lastBubble.querySelector('.bubble').textContent = data.content;
    } else {
      lastBubble = addMsg('agent', data.content);
    }
  } else if (ev === 'tool') {
    // accumulate tool chips into the last bubble's strip
    let strip = chatEl.querySelector('.tool-strip:last-child');
    if (!strip) {
      strip = document.createElement('div');
      strip.className = 'tool-strip';
      chatEl.appendChild(strip);
    }
    const c = document.createElement('span');
    c.className = 'tool-chip';
    c.innerHTML = '<span class="dot"></span>' + data.name;
    strip.appendChild(c);
    // mark previous chips done
    chatEl.querySelectorAll('.tool-chip').forEach(ch => ch.classList.add('done'));
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (ev === 'done') {
    // finalize tool chips
    chatEl.querySelectorAll('.tool-chip').forEach(ch => ch.classList.add('done'));
  } else if (ev === 'error') {
    addMsg('agent', data.content || '内部错误', 'err');
  }
}

function reset() {
  chatEl.innerHTML = '';
  addMsg('agent', '👋 你好!我是 FeynmanTutor — 跑在 AMD Radeon GPU 上的本地学习助手。\n\n告诉我你想学什么,我就会:\n1) 拆解技能 → 2) 收集资料 → 3) 费曼讲解 → 4) 出题测试 → 5) 安排遗忘曲线复习\n\n例如:「我想学 Raft 共识算法」');
  init();
}

sendEl.onclick = () => send(inputEl.value);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
});
document.getElementById('reset').onclick = reset;
document.querySelectorAll('.sug').forEach(s => {
  s.onclick = () => { inputEl.value = s.textContent; send(inputEl.value); };
});

reset();
</script>
</body>
</html>
